# Cross-compilation config for the release workflow's aarch64-unknown-linux-gnu
# build. The default cross image for this target is an old Ubuntu 16.04
# container whose package lists lack the newer libxcb-xinput-dev /
# libgdk-pixbuf-2.0-dev names gpui links, so pin the :main image (Ubuntu 24.04).
# That image is an amd64 container that cross-compiles via qemu, so the gpui
# system deps must be installed as multiarch :arm64 packages (native packages
# would land as amd64 and the aarch64 linker would reject them). Mirrors the
# apt packages the native ubuntu jobs install, suffixed for the target arch.
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y --no-install-recommends libfontconfig1-dev:arm64 libfreetype6-dev:arm64 libxkbcommon-dev:arm64 libwayland-dev:arm64 libx11-dev:arm64 libxcb1-dev:arm64 libxcb-render0-dev:arm64 libxcb-shape0-dev:arm64 libxcb-xfixes0-dev:arm64 libxcb-xkb-dev:arm64 libxcb-icccm4-dev:arm64 libxcb-image0-dev:arm64 libxcb-keysyms1-dev:arm64 libxcb-randr0-dev:arm64 libxcb-render-util0-dev:arm64 libxcb-shm0-dev:arm64 libxcb-util-dev:arm64 libxcb-xinerama0-dev:arm64 libxcb-xinput-dev:arm64 libxkbcommon-x11-dev:arm64 libegl1-mesa-dev:arm64 libgl1-mesa-dev:arm64 libgles2-mesa-dev:arm64 libglib2.0-dev:arm64 libpango1.0-dev:arm64 libcairo2-dev:arm64 libgdk-pixbuf-2.0-dev:arm64 libgtk-3-dev:arm64 pkg-config",
]
