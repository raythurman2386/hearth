# Cross-compilation config for the release workflow's aarch64-unknown-linux-gnu
# build. The default cross image is a bare Debian container without the
# gpui system deps (fontconfig/freetype/xkbcommon/wayland/x11), so install
# them before the build. The cross aarch64 image is already an aarch64 Debian
# container, so native packages suffice. Mirrors the apt packages the native
# ubuntu jobs install.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "apt-get update",
    "apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shm0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xinput-dev libxkbcommon-x11-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libgtk-3-dev pkg-config",
]
