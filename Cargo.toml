[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui-rune",
    "crates/syntax",
    "apps/hearth",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
hearth-proto = { path = "crates/proto" }
hearth-doc = { path = "crates/doc" }
hearth-sync = { path = "crates/sync" }
hearth-harness = { path = "crates/harness" }
hearth-engine = { path = "crates/engine" }
hearth-rpc = { path = "crates/rpc" }
hearth-update = { path = "crates/update" }
hearth-ui-rune = { path = "crates/ui-rune" }
hearth-syntax = { path = "crates/syntax" }

# Rune — Anomaly's native GPU UI framework (pre-release). Pinned to a `dev`
# rev; `dev` is fast-forward-only. Bump deliberately, never to a branch head.
rune = { git = "https://github.com/anomalyco/rune", rev = "424e0f5904b9bc314734370f462b4f4e71a2cc07", default-features = false, features = [
    "svg",
    "accessibility",
    "dbus",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "424e0f5904b9bc314734370f462b4f4e71a2cc07", features = [
    "markdown",
] }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "424e0f5904b9bc314734370f462b4f4e71a2cc07" }

# CRDT
loro = "1.13"

# diffs
similar = "3"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.41", features = ["bundled"] }

# misc
# Global allocator for the binaries: returns freed pages to the OS. System
# malloc (macOS libmalloc especially) retains the churn high-water mark as
# permanent RSS - measured as the top residency cause in docs/memory-plan.md.
mimalloc = "0.1"
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
notify = "8"
portable-pty = "0.9"
alacritty_terminal = "0.26"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
nucleo-matcher = "0.3"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
# Rune + wgpu are slow unoptimized; match zed's approach for deps.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
