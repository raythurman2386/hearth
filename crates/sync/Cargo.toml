[package]
name = "hearth-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hearth-doc.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
sha1 = "0.11"
base64 = "0.23"
socket2 = "0.6"

# NWPathMonitor bridge (net_path.rs) — the update handler is an ObjC block.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

[features]
# In-process registry server speaking the DO's JSON WS protocol — test
# infrastructure for this crate's tests and hearth-engine's integration tests.
mock-server = []

# This target imports `registry::mock_server`, so it only builds with the
# feature on. `cargo test --workspace` enables it (hearth-engine's dev-dep);
# `cargo test -p hearth-sync --features mock-server` runs it in isolation.
[[test]]
name = "registry_client"
required-features = ["mock-server"]

[dev-dependencies]
chrono.workspace = true
hearth-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (the 2026-07-30 sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }
