name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            kind: linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            kind: windows

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shm0-dev \
            libxcb-util-dev libxcb-xinerama0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libpango1.0-dev \
            libcairo2-dev libgdk-pixbuf-2.0-dev libgtk-3-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p hearth

      - name: Package Linux updater tarball
        if: matrix.kind == 'linux'
        id: linux_pkg
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          chmod +x scripts/package-linux.sh
          VERSION="$VERSION" PREBUILT_BIN="target/${{ matrix.target }}/release/hearth" \
            scripts/package-linux.sh
          TARBALL="target/package/hearth-${VERSION}-linux-x86_64.tar.gz"
          test -f "$TARBALL"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "asset=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifact
        if: matrix.kind == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.linux_pkg.outputs.asset }}
          path: ${{ steps.linux_pkg.outputs.tarball }}

      - name: Prepare Windows binary
        if: matrix.kind == 'windows'
        id: win_pkg
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BIN_NAME="hearth-${VERSION}-x86_64-pc-windows-msvc.exe"
          cp "target/${{ matrix.target }}/release/hearth.exe" "${BIN_NAME}"
          mkdir -p stage
          cp "${BIN_NAME}" stage/hearth.exe
          (cd stage && zip -q "../${BIN_NAME}.zip" hearth.exe)
          rm -rf stage
          echo "bin_name=${BIN_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${BIN_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifacts
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.ref_name }}
          path: |
            ${{ steps.win_pkg.outputs.bin_name }}
            ${{ steps.win_pkg.outputs.zip_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums + updater manifest
        working-directory: artifacts
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sha256sum * > checksums.txt
          cat checksums.txt
          chmod +x ../scripts/write-manifest.sh
          ../scripts/write-manifest.sh . "$VERSION"
          echo "--- manifest.json ---"
          cat manifest.json
          echo "--- latest.txt ---"
          cat latest.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
