name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shm0-dev \
            libxcb-util-dev libxcb-xinerama0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libpango1.0-dev \
            libcairo2-dev libgdk-pixbuf-2.0-dev libgtk-3-dev

      - name: Build
        run: cargo build --release

      - name: Prepare binary
        id: artifact
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BIN_NAME="hearth-${VERSION}-x86_64-unknown-linux-gnu"
          cp "target/release/hearth" "${BIN_NAME}"
          echo "bin_name=${BIN_NAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.bin_name }}
          path: ${{ steps.artifact.outputs.bin_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        # Compute SHA-256 over every built binary so the installers can verify
        # integrity. Written into the artifacts dir so it's uploaded alongside
        # the binaries and the installers find it as checksums.txt.
        working-directory: artifacts
        shell: bash
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create archives
        # Build a .tar.gz archive for the ACP registry's `binary`
        # distribution. The archive contains a stable `hearth` name so the
        # registry's `cmd` stays version-independent. The raw binary is kept
        # alongside (the installers download it directly). Archive checksums
        # are appended to checksums.txt so agent.json can pin them.
        working-directory: artifacts
        shell: bash
        run: |
          for f in hearth-*; do
            [[ "$f" == "checksums.txt" ]] && continue
            mkdir -p stage
            cp "$f" stage/hearth
            (cd stage && tar -czf "../${f}.tar.gz" hearth)
            rm -rf stage
          done
          sha256sum hearth-*.tar.gz >> checksums.txt 2>/dev/null || true
          echo "--- checksums.txt (raw + archives) ---"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
